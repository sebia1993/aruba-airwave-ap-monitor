name: Publish verified AirWave v0.1.3-preview.3 ZIP
on:
  push:
    branches: [release/airwave-0.1.3-preview.3]
    paths: [.github/workflows/publish-airwave-0.1.3-preview.3.yml]

permissions:
  actions: read
  contents: write

concurrency: airwave-publish-0.1.3-preview.3

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TESTED_COMMIT: c36f896eae05a2bab18965000dc68ca841b5bf87
      ZIP_SHA256: eb23672a2ff23fac291d628b230de1d472c44e6451935b7b4201d1e522890d59
    steps:
      - name: Publish the tested Windows package as a prerelease
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verified
          gh api "repos/$GH_REPO/actions/runs/45121060829" |
            jq -e '.conclusion == "success" and .head_sha == "9b7853759ba5e01285abc08ece47145f4dc8474f"' >/dev/null
          gh run download 45121060829 --repo "$GH_REPO" --name windows-core-package --dir verified
          shopt -s nullglob
          archives=(verified/*.zip)
          [[ ${#archives[@]} == 1 ]]
          archive=${archives[0]}
          printf '%s  %s\n' "$ZIP_SHA256" "$archive" | sha256sum --check
          unzip -p "$archive" metadata/VERSION.json |
            jq -e --arg sha "$TESTED_COMMIT" '.version == "0.1.3-preview.3" and .source_commit == $sha and .working_tree_dirty == false' >/dev/null
          output=AirWaveAPMonitor-v0.1.3-preview.3-win-x64.zip
          mv "$archive" "$output"
          cat > notes.md <<'NOTES'
          연결 진단은 HTTP 200으로 성공하지만 실제 AP 수집이 임시 고정 조건 오류로 중단되던 문제를 수정했습니다. 수동·예약 수집에서 저장된 인증서 지문과 기존 만료 시각을 그대로 적용합니다.

          Windows x64 ZIP을 새 폴더에 풀고 기존 수집기를 종료한 뒤, 기존 Live 데이터 폴더와 같은 계정으로 최상위 `AirWaveAPMonitor.exe`를 실행하세요. 실제 사내 장비와 연결은 현장에서 확인해야 합니다.

          [Windows 검증 결과](https://github.com/sebia1993/aruba-airwave-ap-monitor/actions/runs/45121060829)

          ZIP SHA-256 `eb23672a2ff23fac291d628b230de1d472c44e6451935b7b4201d1e522890d59`
          NOTES
          gh release create v0.1.3-preview.3 "$output" --repo "$GH_REPO" --target "$TESTED_COMMIT" --prerelease --latest=false --title "v0.1.3-preview.3 – 실제 AP 수집에 등록한 인증서 지문 적용" --notes-file notes.md
