name: Publish verified AirWave v0.1.3-preview.7 ZIP
on:
  push:
    branches: [release/airwave-0.1.3-preview.7]
    paths: [.github/workflows/publish-airwave-0.1.3-preview.7.yml]

permissions:
  actions: read
  contents: write

concurrency: airwave-publish-0.1.3-preview.7

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TESTED_COMMIT: e54280ebaf0d1b8e1da46fd44d3a9fc0f2d457cd
    steps:
      - name: Publish verified package only after complete Windows CI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verified
          complete=no
          for attempt in $(seq 1 55); do
            state=$(gh api "repos/$GH_REPO/actions/runs/45153740833" --jq '.status')
            result=$(gh api "repos/$GH_REPO/actions/runs/45153740833" --jq '.conclusion // ""')
            if [[ "$state" == completed ]]; then
              [[ "$result" == success ]] || { echo "Windows CI conclusion: $result"; exit 1; }
              complete=yes
              break
            fi
            sleep 10
          done
          [[ "$complete" == yes ]] || { echo 'Windows verification not complete'; exit 1; }
          gh api "repos/$GH_REPO/actions/runs/45153740833" |
            jq -e '.conclusion == "success" and .head_sha == "1a24c116abe1a37a43ee2e94dca5c05b40457a10"' >/dev/null
          gh run download 45153740833 --repo "$GH_REPO" --name windows-core-package --dir verified
          shopt -s nullglob
          archives=(verified/*.zip)
          sums=(verified/*.zip.sha256)
          [[ ${#archives[@]} -eq 1 && ${#sums[@]} -eq 1 ]] || { echo 'Expected one verified zip and checksum'; exit 1; }
          archive=${archives[0]}
          (cd verified && sha256sum -c "$(basename "${sums[0]}")")
          unzip -p "$archive" metadata/VERSION.json |
            jq -e --arg sha "$TESTED_COMMIT" '.version == "0.1.3-preview.7" and .source_commit == $sha and .working_tree_dirty == false and .onsite_verified == false' >/dev/null
          sha=$(sha256sum "$archive" | awk '{print $1}')
          output=AirWaveAPMonitor-v0.1.3-preview.7-win-x64.zip
          mv "$archive" "$output"
          cat > notes.md <<'NOTES'
          **처음 연결 안내 기능 포함:** 처음 설정할 때 IP·포트, 읽기 계정, HTTPS 인증서, AP 목록 조회, 실제 AP 수집 저장 순서로 안내합니다. 기존 정상 수집 환경은 안내를 건너뜁니다.

          인증서 지문 자동 조회만으로 승인하지 않고 독립 대조 후에만 적용합니다. HTTP 403 자동 재로그인도 하지 않습니다. 진단 HTTP 200과 실제 수집 저장 성공을 구분합니다.

          기존 EXE를 종료하고 ZIP을 새로운 폴더에 풀어, 같은 Windows 계정과 기존 Live 데이터 폴더로 `AirWaveAPMonitor.exe`를 실행하세요. 사내 장비 연동 검증은 사용자가 직접 진행합니다.

          [Windows 검증 결과](https://github.com/sebia1993/aruba-airwave-ap-monitor/actions/runs/45153740833)

          [변경 내역 PR #6](https://github.com/sebia1993/aruba-airwave-ap-monitor/pull/6)
          NOTES
          printf '\nZIP SHA-256 `%s`\n' "$sha" >> notes.md
          gh release create v0.1.3-preview.7 "$output" --repo "$GH_REPO" --target "$TESTED_COMMIT" --prerelease --latest=false --title "v0.1.3-preview.7 – 최초 AirWave 연결 안내" --notes-file notes.md
