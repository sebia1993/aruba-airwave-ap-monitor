name: Publish verified AirWave v0.1.3-preview.5 ZIP
on:
  push:
    branches: [release/airwave-0.1.3-preview.5]
    paths: [.github/workflows/publish-airwave-0.1.3-preview.5.yml]

permissions:
  actions: read
  contents: write

concurrency: airwave-publish-0.1.3-preview.5

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TESTED_COMMIT: bcec07a67a68d457721ab6c2d34b790f249b1280
      ZIP_SHA256: 5aa381eec2e33da5297d520b81bd47d798c92f813a09a2ae872c84c9da6f43ae
    steps:
      - name: Publish the tested Windows package as a prerelease
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verified
          gh api "repos/$GH_REPO/actions/runs/45143079165" |
            jq -e '.conclusion == "success" and .head_sha == "e1cc929a6cf878ec9a3f3a3790ac8509e1aa3447"' >/dev/null
          gh run download 45143079165 --repo "$GH_REPO" --name windows-core-package --dir verified
          shopt -s nullglob
          archives=(verified/*.zip)
          [[ ${#archives[@]} == 1 ]]
          archive=${archives[0]}
          printf '%s  %s\n' "$ZIP_SHA256" "$archive" | sha256sum --check
          unzip -p "$archive" metadata/VERSION.json |
            jq -e --arg sha "$TESTED_COMMIT" '.version == "0.1.3-preview.5" and .source_commit == $sha and .working_tree_dirty == false' >/dev/null
          output=AirWaveAPMonitor-v0.1.3-preview.5-win-x64.zip
          mv "$archive" "$output"
          cat > notes.md <<'NOTES'
          **AP 통합 현황**에서 장비를 선택한 뒤 상태, 장애·조치, 연결·전력, 대장 탭을 이동할 수 있습니다. 장애·조치에서 같은 AP의 사건별 이력과 작업을 확인합니다.

          **장애·작업 이력**에서 전체 대상 작업을, **AP·설치 대장**에서 등록 정보와 설치 지점을 관리합니다. **수집 기록**에서는 AP 상태·연결·전력 회차를 한 곳에서 조회할 수 있습니다.

          과거 회차에 작업 저장 순서의 근거가 없는 경우 확인 가능한 자동 이력만 표시합니다. 실제 AirWave 연결·대수는 사내 수집 PC에서 확인하세요.

          기존 수집기를 종료한 뒤 새 폴더에 ZIP을 풀고 같은 실행 계정과 기존 데이터 폴더로 최상위 `AirWaveAPMonitor.exe`를 실행하세요.

          [Windows 검증 결과](https://github.com/sebia1993/aruba-airwave-ap-monitor/actions/runs/45143079165)

          ZIP SHA-256 `5aa381eec2e33da5297d520b81bd47d798c92f813a09a2ae872c84c9da6f43ae`
          NOTES
          gh release create v0.1.3-preview.5 "$output" --repo "$GH_REPO" --target "$TESTED_COMMIT" --prerelease --latest=false --title "v0.1.3-preview.5 – AP 통합 현황 및 사건별 조치 이력" --notes-file notes.md
