name: Publish verified AirWave v0.1.3-preview.6 ZIP
on:
  push:
    branches: [release/airwave-0.1.3-preview.6]
    paths: [.github/workflows/publish-airwave-0.1.3-preview.6.yml]

permissions:
  actions: read
  contents: write

concurrency: airwave-publish-0.1.3-preview.6

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TESTED_COMMIT: 5e169c84f88dee73a52ca5ed482b355dd92ef52c
      ZIP_SHA256: 040e97ae14e88ddb00a261103d90c12f9a984ac2ffb92a02cd81798d6c274a68
    steps:
      - name: Publish the tested Windows package as a prerelease
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verified
          gh api "repos/$GH_REPO/actions/runs/45149904627" |
            jq -e '.conclusion == "success" and .head_sha == "a3015d0d00353f944b268fc7cc88376604386bfa"' >/dev/null
          gh run download 45149904627 --repo "$GH_REPO" --name windows-core-package --dir verified
          shopt -s nullglob
          archives=(verified/*.zip)
          [[ ${#archives[@]} == 1 ]]
          archive=${archives[0]}
          printf '%s  %s\n' "$ZIP_SHA256" "$archive" | sha256sum --check
          unzip -p "$archive" metadata/VERSION.json |
            jq -e --arg sha "$TESTED_COMMIT" '.version == "0.1.3-preview.6" and .source_commit == $sha and .working_tree_dirty == false' >/dev/null
          output=AirWaveAPMonitor-v0.1.3-preview.6-win-x64.zip
          mv "$archive" "$output"
          cat > notes.md <<'NOTES'
          **AP 현황**에서 이번 수집에 장애 또는 미확인으로 나타난 장비부터 확인하세요. 이름이나 IP를 입력하면 정상 AP도 찾을 수 있습니다.

          열린 장애가 있는 Down AP를 누르면 해당 사건에서 조치 내용을 입력해 저장할 수 있습니다. AP 정보·연결·전력·대장은 장비를 선택한 뒤 탭에서 확인하세요.

          수집 기록, 대장과 연결 설정은 **관리**에 있습니다. 상세 필터·CSV와 수동 수집 도구는 필요할 때 펼쳐 사용하세요.

          기존 수집기를 종료한 뒤 새 폴더에 ZIP을 풀고 같은 실행 계정과 기존 데이터 폴더로 최상위 `AirWaveAPMonitor.exe`를 실행하세요.

          [Windows 검증 결과](https://github.com/sebia1993/aruba-airwave-ap-monitor/actions/runs/45149904627)

          ZIP SHA-256 `040e97ae14e88ddb00a261103d90c12f9a984ac2ffb92a02cd81798d6c274a68`
          NOTES
          gh release create v0.1.3-preview.6 "$output" --repo "$GH_REPO" --target "$TESTED_COMMIT" --prerelease --latest=false --title "v0.1.3-preview.6 – 장애 우선 AP 현황과 간편 조치 메모" --notes-file notes.md
