name: Publish verified AirWave v0.1.3-preview.2 ZIP
on:
  push:
    branches: [release/airwave-0.1.3-preview.2]
    paths: [.github/workflows/publish-airwave-0.1.3-preview.2.yml]

permissions:
  actions: read
  contents: write

concurrency: airwave-publish-0.1.3-preview.2

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TESTED_COMMIT: bff8d85a517e0e4a85a0b6bcac1c4b5b55a8e1a4
      ZIP_SHA256: 38b0333211550d463a04f224c6274669bd7896010a8d68014072137e71d24de7
    steps:
      - name: Publish the tested Windows package as a prerelease
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verified
          gh api "repos/$GH_REPO/actions/runs/45116778969" |
            jq -e '.conclusion == "success" and .head_sha == "19269e2338f026d07e08bbd07e956a9d11e828f1"' >/dev/null
          gh run download 45116778969 --repo "$GH_REPO" --name windows-core-package --dir verified
          shopt -s nullglob
          archives=(verified/*.zip)
          [[ ${#archives[@]} == 1 ]]
          archive=${archives[0]}
          printf '%s  %s\n' "$ZIP_SHA256" "$archive" | sha256sum --check
          unzip -p "$archive" metadata/VERSION.json |
            jq -e --arg sha "$TESTED_COMMIT" '.version == "0.1.3-preview.2" and .source_commit == $sha and .working_tree_dirty == false' >/dev/null
          output=AirWaveAPMonitor-v0.1.3-preview.2-win-x64.zip
          mv "$archive" "$output"
          cat > notes.md <<'NOTES'
          IP와 포트로 접속하는 AirWave에 서버 인증서 SHA-256 지문을 1~168시간 동안 등록할 수 있습니다. 연결 설정의 **AirWave 인증서 임시 허용**에서 별도로 확인한 지문을 등록하고 **연결 진단 실행**을 누르세요. 지문이 달라지거나 기간이 지나면 수집을 차단합니다.

          Windows x64 ZIP을 새 폴더에 풀고 기존 수집기를 종료한 뒤, 기존 Live 데이터 폴더와 같은 계정으로 최상위 `AirWaveAPMonitor.exe`를 실행하세요. 실제 사내 장비와 연결은 현장에서 확인해야 합니다.

          [Windows 검증 결과](https://github.com/sebia1993/aruba-airwave-ap-monitor/actions/runs/45116778969)

          ZIP SHA-256 `38b0333211550d463a04f224c6274669bd7896010a8d68014072137e71d24de7`
          NOTES
          gh release create v0.1.3-preview.2 "$output" --repo "$GH_REPO" --target "$TESTED_COMMIT" --prerelease --latest=false --title "v0.1.3-preview.2 – AirWave 인증서 지문 임시 허용" --notes-file notes.md
