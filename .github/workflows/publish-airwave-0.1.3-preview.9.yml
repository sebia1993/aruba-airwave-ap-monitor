name: Publish verified AirWave v0.1.3-preview.9 ZIP
on:
  push:
    branches: [release/airwave-0.1.3-preview.9]
    paths: [.github/workflows/publish-airwave-0.1.3-preview.9.yml]

permissions:
  actions: read
  contents: write

concurrency: airwave-publish-0.1.3-preview.9

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TESTED_COMMIT: 66d3a5d39d9ada183e0275632976260f97bf836b
    steps:
      - name: Publish verified package only after complete Windows CI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verified
          complete=no
          for attempt in $(seq 1 55); do
            state=$(gh api "repos/$GH_REPO/actions/runs/45192724491" --jq '.status')
            result=$(gh api "repos/$GH_REPO/actions/runs/45192724491" --jq '.conclusion // ""')
            if [[ "$state" == completed ]]; then
              [[ "$result" == success ]] || { echo "Windows CI conclusion: $result"; exit 1; }
              complete=yes
              break
            fi
            sleep 10
          done
          [[ "$complete" == yes ]] || { echo 'Windows verification not complete'; exit 1; }
          gh api "repos/$GH_REPO/actions/runs/45192724491" |
            jq -e '.conclusion == "success" and .head_sha == "8a47b9e36e8a8e749bfded0a66c00350b67e92d5"' >/dev/null
          gh run download 45192724491 --repo "$GH_REPO" --name windows-core-package --dir verified
          shopt -s nullglob
          archives=(verified/*.zip)
          sums=(verified/*.zip.sha256)
          [[ ${#archives[@]} -eq 1 && ${#sums[@]} -eq 1 ]] || { echo 'Expected one verified zip and checksum'; exit 1; }
          archive=${archives[0]}
          (cd verified && sha256sum -c "$(basename "${sums[0]}")")
          unzip -p "$archive" metadata/VERSION.json |
            jq -e --arg sha "$TESTED_COMMIT" '.version == "0.1.3-preview.9" and .source_commit == $sha and .working_tree_dirty == false and .onsite_verified == false' >/dev/null
          sha=$(sha256sum "$archive" | awk '{print $1}')
          output=AirWaveAPMonitor-v0.1.3-preview.9-win-x64.zip
          mv "$archive" "$output"
          cat > notes.md <<'NOTES'
          **안전 진단 복사/JSON 저장**: 관리 → 연결 설정에서 원문이 아닌 허용된 상태·건수만 내보냅니다. IP·계정·비밀번호·서버 인증서 지문·AP 이름/원천 ID·원문 로그는 보고서에 포함하지 않습니다.

          **실행 패키지 버전 조회**: 패키지의 VERSION.json을 실제 앱 경로에서 읽어 버전 및 소스 커밋을 표시합니다. 메타데이터가 없거나 잘못되면 미확인으로 표시합니다.

          **검증 보강**: Windows Edge headless GUI에서 AP 목록·상세·장애 메모 편집기·도움말·설정 화면을 확인하고, 가상 2,000대/5,000대 각 6회 XML 파싱 및 기본 수집 회귀를 검증합니다. 이는 실제 AirWave 5,000대/24시간 운영 검증을 의미하지 않습니다.

          기존 버전은 종료하고 새 ZIP을 별도 폴더에 풀어 같은 Windows 계정·데이터 폴더로 실행하세요. main 병합과 실제 AirWave 검증은 보류합니다.

          [Windows CI 결과](https://github.com/sebia1993/aruba-airwave-ap-monitor/actions/runs/45192724491)
          [PR #9](https://github.com/sebia1993/aruba-airwave-ap-monitor/pull/9)
          NOTES
          printf '\nZIP SHA-256 `%s`\n' "$sha" >> notes.md
          gh release create v0.1.3-preview.9 "$output" --repo "$GH_REPO" --target "$TESTED_COMMIT" --prerelease --latest=false --title "v0.1.3-preview.9 – 수집 오류 요약 및 사용법·업데이트 안전화" --notes-file notes.md
