name: Publish verified AirWave v0.1.3-preview.1 ZIP
on:
  push:
    branches: [release/airwave-0.1.3-preview.1]
    paths: [.github/workflows/publish-airwave-0.1.3-preview.1.yml]

permissions:
  actions: read
  contents: write

concurrency: airwave-publish-0.1.3-preview.1

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TESTED_COMMIT: 08333060bae6608343e444027dfeee081a9b91dd
      ZIP_SHA256: 1d52cbab71b61bf9f5748742dfe34875e4e66e00ba5ac82bc8d8b35a1466bda6
    steps:
      - name: Publish the tested Windows package as a prerelease
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verified
          gh api "repos/$GH_REPO/actions/runs/45094306303" |
            jq -e '.conclusion == "success" and .head_sha == "7e4b0a032deac32475d68ec7a1e836cee0f8f15b"' >/dev/null
          gh run download 45094306303 --repo "$GH_REPO" --name windows-core-package --dir verified
          shopt -s nullglob
          archives=(verified/*.zip)
          [[ ${#archives[@]} == 1 ]]
          archive=${archives[0]}
          printf '%s  %s\n' "$ZIP_SHA256" "$archive" | sha256sum --check
          unzip -p "$archive" metadata/VERSION.json |
            jq -e --arg sha "$TESTED_COMMIT" '.version == "0.1.3-preview.1" and .source_commit == $sha and .working_tree_dirty == false' >/dev/null
          output=AirWaveAPMonitor-v0.1.3-preview.1-win-x64.zip
          mv "$archive" "$output"
          cat > notes.md <<'NOTES'
          AirWave 연결 진단에서 인증서 서버 이름과 신뢰 체인 상태를 각각 확인할 수 있습니다. HTTPS 프록시 인증서에서 오류가 발생하면 프록시 단계로 표시합니다.

          Windows x64 ZIP 전체를 새 폴더에 풀고 최상위 `AirWaveAPMonitor.exe`를 실행하세요. **연결 설정 → 연결 진단 실행**에서 결과를 확인할 수 있습니다.

          [Windows 검증 결과](https://github.com/sebia1993/aruba-airwave-ap-monitor/actions/runs/45094306303)

          ZIP SHA-256 `1d52cbab71b61bf9f5748742dfe34875e4e66e00ba5ac82bc8d8b35a1466bda6`
          NOTES
          gh release create v0.1.3-preview.1 "$output" --repo "$GH_REPO" --target "$TESTED_COMMIT" --prerelease --latest=false --title "v0.1.3-preview.1 – Windows TLS 진단 현장 검증본" --notes-file notes.md
