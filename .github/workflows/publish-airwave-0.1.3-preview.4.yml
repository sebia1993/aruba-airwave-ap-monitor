name: Publish verified AirWave v0.1.3-preview.4 ZIP
on:
  push:
    branches: [release/airwave-0.1.3-preview.4]
    paths: [.github/workflows/publish-airwave-0.1.3-preview.4.yml]

permissions:
  actions: read
  contents: write

concurrency: airwave-publish-0.1.3-preview.4

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TESTED_COMMIT: 67ffddf6b2693289da0f1a94d3bba11194f8f1e3
      ZIP_SHA256: f4a14cef39870958d14aa761a21e9e87c71d9f9e861d2cefad55239a143422fa
    steps:
      - name: Publish the tested Windows package as a prerelease
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verified
          gh api "repos/$GH_REPO/actions/runs/45128686972" |
            jq -e '.conclusion == "success" and .head_sha == "6ea56ff4663ef64e83f123e0a180536be85dc5b7"' >/dev/null
          gh run download 45128686972 --repo "$GH_REPO" --name windows-core-package --dir verified
          shopt -s nullglob
          archives=(verified/*.zip)
          [[ ${#archives[@]} == 1 ]]
          archive=${archives[0]}
          printf '%s  %s\n' "$ZIP_SHA256" "$archive" | sha256sum --check
          unzip -p "$archive" metadata/VERSION.json |
            jq -e --arg sha "$TESTED_COMMIT" '.version == "0.1.3-preview.4" and .source_commit == $sha and .working_tree_dirty == false' >/dev/null
          output=AirWaveAPMonitor-v0.1.3-preview.4-win-x64.zip
          mv "$archive" "$output"
          cat > notes.md <<'NOTES'
          연결 설정 → AirWave 인증서 지문에서 **인증서 자동 조회**를 누르세요. 기존 등록 지문과 일치하면 **해제할 때까지 허용**으로 전환할 수 있습니다. 수집기는 적용 직전에 인증서를 다시 확인하며, 교체된 인증서에는 AirWave 로그인 정보를 보내지 않습니다.

          이전 시간제 지문은 사용자가 전환할 때까지 원래 만료 시각을 유지합니다. 처음 등록하거나 기존 허용 기간이 만료된 경우에는 별도로 확인한 지문과 대조합니다. 이전 버전으로 복귀할 가능성이 있으면 무기한 전환 전에 데이터 폴더를 백업하세요.

          Windows x64 ZIP을 새 폴더에 풀고 기존 수집기를 종료한 뒤, 기존 Live 데이터 폴더와 같은 계정으로 최상위 `AirWaveAPMonitor.exe`를 실행하세요. 실제 사내 장비와 연결은 현장에서 확인해야 합니다.

          [Windows 검증 결과](https://github.com/sebia1993/aruba-airwave-ap-monitor/actions/runs/45128686972)

          ZIP SHA-256 `f4a14cef39870958d14aa761a21e9e87c71d9f9e861d2cefad55239a143422fa`
          NOTES
          gh release create v0.1.3-preview.4 "$output" --repo "$GH_REPO" --target "$TESTED_COMMIT" --prerelease --latest=false --title "v0.1.3-preview.4 – AirWave 인증서 자동 조회 및 무기한 허용" --notes-file notes.md
