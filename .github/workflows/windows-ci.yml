name: Windows verification

on:
  workflow_dispatch:
  push:
    branches: [codex/macos-v0.1]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/guides/**'
      - '*.slnx'
      - '*.props'
      - 'global.json'
      - '.github/workflows/windows-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/guides/**'
      - '*.slnx'
      - '*.props'
      - 'global.json'
      - '.github/workflows/windows-ci.yml'

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore AirWaveApMonitor.slnx
      - name: Build
        run: dotnet build AirWaveApMonitor.slnx -c Release --no-restore
      - name: Common behavior tests on Windows
        run: dotnet test tests/AirWaveApMonitor.Tests -c Release --no-build --logger "trx;LogFileName=common-windows.trx"
      - name: Windows-specific tests
        run: dotnet test tests/AirWaveApMonitor.WindowsTests -c Release --no-build --logger "trx;LogFileName=windows-specific.trx"
      - name: Package integrity and exclusion tests
        run: python -m unittest discover -s tests/Packaging -v
      - name: Publish self-contained Windows application
        run: dotnet publish src/AirWaveApMonitor.App -c Release -r win-x64 --self-contained true -p:PublishAot=false -p:PublishReadyToRun=false -p:PublishTrimmed=false -p:PublishSingleFile=false -o artifacts/win-x64/app
      - name: Package and run extracted ZIP from Korean and space path
        shell: powershell
        run: |
          $archive = python ./scripts/package_initial.py ./artifacts/win-x64/app ./artifacts/win-x64/bundles
          if ($LASTEXITCODE -ne 0) { throw 'Initial package creation failed.' }
          ./scripts/ci/windows-package-smoke.ps1 -Archive $archive
