name: Windows verification

on:
  workflow_dispatch:
  push:
    branches: [codex/macos-v0.1, main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/guides/**'
      - '*.slnx'
      - '*.props'
      - 'global.json'
      - '.github/workflows/windows-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/guides/**'
      - '*.slnx'
      - '*.props'
      - 'global.json'
      - '.github/workflows/windows-ci.yml'

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Frontend syntax and state behavior
        run: |
          node --check src/AirWaveApMonitor.App/wwwroot/app.js
          node --check src/AirWaveApMonitor.App/wwwroot/ui-state.js
          node --check src/AirWaveApMonitor.App/wwwroot/operations.js
          node --check src/AirWaveApMonitor.App/wwwroot/enrichment.js
          node tests/Frontend/ui-state.test.mjs
          node tests/Frontend/operations.test.mjs
          node tests/Frontend/operations-dom.test.mjs
          node tests/Frontend/enrichment.test.mjs
          node tests/Frontend/enrichment-dom.test.mjs
          node tests/Frontend/requirements-ui.test.mjs
          node tests/Frontend/ap-console-dom.test.mjs
      - name: Restore
        run: dotnet restore AirWaveApMonitor.slnx
      - name: Build
        id: build
        run: dotnet build AirWaveApMonitor.slnx -c Release --no-restore
      - name: Build native desktop launcher
        id: native
        run: ./scripts/build-launcher.ps1 -OutputDirectory artifacts/win-x64/launcher
      - name: Desktop startup and data directory regression tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test tests/AirWaveApMonitor.Tests -c Release --no-build --filter "FullyQualifiedName~Runtime.Desktop" --logger "trx;LogFileName=desktop-windows.trx"
      - name: Common behavior tests on Windows
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test tests/AirWaveApMonitor.Tests -c Release --no-build --logger "trx;LogFileName=common-windows.trx"
      - name: Windows-specific tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test tests/AirWaveApMonitor.WindowsTests -c Release --no-build --logger "trx;LogFileName=windows-specific.trx"
      - name: Package integrity and exclusion tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python -m unittest discover -s tests/Packaging -v
      - name: Publish self-contained Windows application
        id: publish
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet publish src/AirWaveApMonitor.App -c Release -r win-x64 --self-contained true -p:PublishAot=false -p:PublishReadyToRun=false -p:PublishTrimmed=false -p:PublishSingleFile=false -o artifacts/win-x64/app
      - name: Package and run extracted ZIP from Korean and space path
        if: ${{ !cancelled() && steps.publish.outcome == 'success' && steps.native.outcome == 'success' }}
        shell: powershell
        run: |
          $archive = python ./scripts/package_core.py ./artifacts/win-x64/app ./artifacts/win-x64/bundles --launcher ./artifacts/win-x64/launcher/AirWaveAPMonitor.exe
          if ($LASTEXITCODE -ne 0) { throw 'Core package creation failed.' }
          ./scripts/ci/windows-package-smoke.ps1 -Archive $archive
      - name: Preserve the verified Windows core ZIP
        # Independent checks above keep their diagnostics after a failure. A release
        # candidate is uploaded only when every preceding verification succeeded.
        if: ${{ success() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-core-package
          path: |
            artifacts/win-x64/bundles/*.zip
            artifacts/win-x64/bundles/*.zip.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Preserve Windows test diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-test-results
          path: tests/**/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 1
      - name: Preserve Windows native smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-native-diagnostics
          path: |
            artifacts/windows-smoke-diagnostics/*.log
            artifacts/windows-smoke-diagnostics/collector-waits.json
            artifacts/windows-launcher-diagnostics/*.json
            artifacts/windows-launcher-diagnostics/*.log
          if-no-files-found: ignore
          retention-days: 1
