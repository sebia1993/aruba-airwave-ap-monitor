<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>AirWave AP Monitor — 사용자 흐름 모의화면</title><meta name="description" content="가상 AP 데이터로 살펴보는 다운 AP 감시 프로그램 모의화면. 실제 AirWave에 연결하지 않습니다."><style>body{margin:0;padding:24px;background:light-dark(#eef1f5,#10151d);color-scheme:light dark;}#apm-prototype-v1{max-width:1200px;margin:auto;}@media(max-width:620px){body{padding:10px;}}</style></head><body>
<div id="apm-prototype-v1" lang="ko">
  <div class="am-previewbar">
    <div><strong>화면 미리보기</strong><span>가상 장비 2,048대 · 실제 연결 없음</span></div>
    <div class="am-previewcontrols">
      <label for="am-scenario">수집 상황</label>
      <select id="am-scenario" class="cursor-interaction" aria-label="가상 수집 상황">
        <option value="0">11:05 · 수집 정상</option>
        <option value="1">11:10 · 신규 Down</option>
        <option value="2">11:15 · 복구 확인</option>
        <option value="3">11:20 · 전체 수집 실패</option>
        <option value="4">11:25 · 일부 AP 누락</option>
      </select>
      <button class="am-smallbtn cursor-interaction" type="button" data-action="play" id="am-play">순서대로 재생</button>
    </div>
  </div>
  <div class="am-window">
    <aside class="am-sidebar">
      <div class="am-brand"><span class="am-brandmark">AP</span><div><strong>AirWave Monitor</strong><span>LOCAL OPERATIONS</span></div></div>
      <div class="am-navcaption">모니터링</div>
      <nav aria-label="프로그램 메뉴">
        <button type="button" class="am-navitem cursor-interaction is-active" data-view="dashboard"><i data-lucide="radio-tower" aria-hidden="true"></i><span>다운 AP 현황</span><b id="am-nav-count">8</b></button>
        <button type="button" class="am-navitem cursor-interaction" data-view="history"><i data-lucide="history" aria-hidden="true"></i><span>장애·복구 이력</span></button>
        <button type="button" class="am-navitem cursor-interaction" data-view="runs"><i data-lucide="list-checks" aria-hidden="true"></i><span>수집 기록</span></button>
        <div class="am-navcaption">관리</div>
        <button type="button" class="am-navitem cursor-interaction" data-view="settings"><i data-lucide="settings-2" aria-hidden="true"></i><span>연결 설정</span></button>
        <button type="button" class="am-navitem cursor-interaction" data-view="flow"><i data-lucide="route" aria-hidden="true"></i><span>사용 흐름 보기</span></button>
      </nav>
      <div class="am-sidebottom">
        <span class="am-localdot"></span><strong>수집 PC 전용</strong>
        <p>자동 수집 · 로컬 이력 보관</p>
        <small>UI 제안안 / 가상 데이터</small>
      </div>
    </aside>
    <div class="am-main">
      <header class="am-topbar">
        <div class="am-breadcrumb">운영 콘솔 <span>/</span> <strong id="am-crumb">다운 AP 현황</strong></div>
        <div class="am-topright"><span class="am-collectbadge" id="am-collector">자동 수집 중</span><span class="am-profile">운영자</span></div>
      </header>
      <main id="am-stage" class="am-stage" aria-label="AP 감시 프로그램 모의화면"></main>
      <footer class="am-footer"><span>가상 시각 · 2026.11.15 KST</span><span>실제 제품은 창을 닫아도 수집을 계속하도록 설계</span></footer>
    </div>
  </div>
  <div class="am-toast" id="am-toast" role="status" aria-live="polite" hidden></div>
</div>
<style>
#apm-prototype-v1 {
  color-scheme: light dark;
  --am-bg: light-dark(#f3f5f8,#101722);
  --am-panel: light-dark(#ffffff,#192330);
  --am-subtle: light-dark(#f7f9fc,#202d3d);
  --am-ink: light-dark(#17283d,#e6edf6);
  --am-muted: light-dark(#5b6c80,#a7b5c7);
  --am-line: light-dark(#dce3ec,#344255);
  --am-blue: light-dark(#1855cf,#94b8ff);
  --am-bluebg: light-dark(#edf3ff,#243858);
  --am-red: light-dark(#b72f43,#ff9eac);
  --am-redbg: light-dark(#fff0f2,#452737);
  --am-green: light-dark(#147356,#81d7b8);
  --am-greenbg: light-dark(#edf9f3,#193c34);
  --am-amber: light-dark(#8d590f,#f1c37c);
  --am-amberbg: light-dark(#fff6e7,#413527);
  --am-sidebar: light-dark(#17253b,#0d1420);
  --am-sidebartext: light-dark(#ccd7e6,#becce0);
  --am-sidebaractive: light-dark(#273b59,#243652);
  --am-sidebarline: light-dark(#30425b,#2a3a50);
  --am-white: light-dark(#ffffff,#e6edf6);
  width:100%; min-width:0; color:var(--am-ink);
  font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:13px; line-height:1.55; letter-spacing:-.025em;
}
#apm-prototype-v1 * { box-sizing:border-box; }
#apm-prototype-v1 i[data-lucide]:empty {display:none;}
#apm-prototype-v1 button, #apm-prototype-v1 input, #apm-prototype-v1 select, #apm-prototype-v1 textarea {font:inherit;letter-spacing:inherit;}
#apm-prototype-v1 button {color:inherit;}
#apm-prototype-v1 button:disabled {opacity:.48;cursor:not-allowed;}
#apm-prototype-v1 .am-previewbar {display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin:0 0 12px;padding:8px 0;}
#apm-prototype-v1 .am-previewbar>div:first-child {display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
#apm-prototype-v1 .am-previewbar strong {font-size:14px;font-weight:650;}
#apm-prototype-v1 .am-previewbar span {font-size:12px;color:var(--am-muted);}
#apm-prototype-v1 .am-previewcontrols {display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
#apm-prototype-v1 .am-previewcontrols label {color:var(--am-muted);font-size:12px;}
#apm-prototype-v1 .am-previewcontrols select {border:1px solid var(--am-line);background:var(--am-panel);color:var(--am-ink);border-radius:7px;padding:7px 28px 7px 9px;max-width:100%;}
#apm-prototype-v1 .am-smallbtn {background:var(--am-panel);border:1px solid var(--am-line);border-radius:7px;padding:7px 10px;white-space:nowrap;}
#apm-prototype-v1 .am-window {display:grid;grid-template-columns:174px minmax(0,1fr);border:1px solid var(--am-line);border-radius:13px;overflow:clip;background:var(--am-bg);}
#apm-prototype-v1 .am-sidebar {background:var(--am-sidebar);color:var(--am-sidebartext);display:flex;flex-direction:column;padding:24px 12px 18px;min-width:0;}
#apm-prototype-v1 .am-brand {display:flex;gap:8px;align-items:center;padding:0 4px 28px;}
#apm-prototype-v1 .am-brandmark {background:light-dark(#3480f7,#3573cc);color:light-dark(#fff,#fff);display:grid;place-items:center;width:31px;height:34px;border-radius:9px;font-size:13px;font-weight:750;letter-spacing:0;flex-shrink:0;}
#apm-prototype-v1 .am-brand strong {display:block;font-size:12px;color:var(--am-white);letter-spacing:-.035em;white-space:nowrap;}
#apm-prototype-v1 .am-brand span:not(.am-brandmark) {display:block;font-size:9px;letter-spacing:1px;margin-top:3px;color:light-dark(#a5b7cf,#a5b7cf);}
#apm-prototype-v1 .am-navcaption {font-size:10px;letter-spacing:.08em;color:light-dark(#8da4c1,#9bb0cc);padding:0 10px;margin:5px 0 9px;}
#apm-prototype-v1 nav .am-navcaption {margin-top:28px;}
#apm-prototype-v1 .am-navitem {width:100%;display:flex;align-items:center;gap:9px;border:0;background:transparent;color:var(--am-sidebartext);padding:11px 10px;margin:3px 0;border-radius:8px;text-align:left;font-size:12px;white-space:nowrap;}
#apm-prototype-v1 .am-navitem i, #apm-prototype-v1 .am-navitem svg {width:16px;height:16px;flex-shrink:0;opacity:.9;}
#apm-prototype-v1 .am-navitem.is-active {background:var(--am-sidebaractive);color:var(--am-white);font-weight:650;}
#apm-prototype-v1 .am-navitem b {margin-left:auto;background:light-dark(#46618a,#44618b);padding:0 6px;border-radius:5px;font-size:11px;}
#apm-prototype-v1 .am-navitem:hover {background:var(--am-sidebaractive);}
#apm-prototype-v1 .am-sidebottom {margin-top:auto;padding:50px 9px 0;font-size:11px;}
#apm-prototype-v1 .am-sidebottom p {margin:5px 0 14px;color:light-dark(#a5b7cf,#a5b7cf);font-size:11px;}
#apm-prototype-v1 .am-sidebottom small {border-top:1px solid var(--am-sidebarline);display:block;padding-top:12px;color:light-dark(#91a9c7,#9fb5d0);font-size:10px;}
#apm-prototype-v1 .am-localdot {display:inline-block;width:6px;height:6px;border-radius:50%;background:light-dark(#7ccfb4,#7ccfb4);margin-right:7px;}
#apm-prototype-v1 .am-main {min-width:0;}
#apm-prototype-v1 .am-topbar {display:flex;gap:12px;align-items:center;justify-content:space-between;padding:15px 22px;background:var(--am-panel);border-bottom:1px solid var(--am-line);}
#apm-prototype-v1 .am-breadcrumb {font-size:11px;color:var(--am-muted);display:flex;gap:9px;align-items:center;}
#apm-prototype-v1 .am-breadcrumb strong {color:var(--am-ink);font-weight:550;}
#apm-prototype-v1 .am-breadcrumb>span {color:var(--am-muted);opacity:.6;}
#apm-prototype-v1 .am-topright {display:flex;align-items:center;gap:12px;font-size:11px;}
#apm-prototype-v1 .am-collectbadge {display:inline-flex;align-items:center;gap:6px;color:var(--am-green);}
#apm-prototype-v1 .am-collectbadge:before {content:"";width:6px;height:6px;background:currentColor;border-radius:50%;}
#apm-prototype-v1 .am-collectbadge.is-error {color:var(--am-red);}
#apm-prototype-v1 .am-collectbadge.is-warn {color:var(--am-amber);}
#apm-prototype-v1 .am-profile {color:var(--am-muted);padding-left:12px;border-left:1px solid var(--am-line);}
#apm-prototype-v1 .am-stage {padding:24px 22px 22px;min-width:0;min-height:620px;}
#apm-prototype-v1 .am-heading {display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:18px;}
#apm-prototype-v1 h1 {font-size:25px;line-height:1.25;font-weight:720;letter-spacing:-.05em;margin:0 0 8px;color:var(--am-ink);}
#apm-prototype-v1 h2 {font-size:15px;font-weight:650;line-height:1.45;margin:0;color:var(--am-ink);}
#apm-prototype-v1 h3 {font-size:13px;font-weight:650;margin:0 0 9px;}
#apm-prototype-v1 p {margin:0;}
#apm-prototype-v1 .am-subtitle {font-size:12px;color:var(--am-muted);}
#apm-prototype-v1 .am-actions {display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
#apm-prototype-v1 .am-button {border:1px solid var(--am-line);background:var(--am-panel);padding:8px 12px;border-radius:7px;white-space:nowrap;font-size:12px;display:inline-flex;justify-content:center;align-items:center;gap:7px;text-decoration:none;}
#apm-prototype-v1 .am-button:hover {background:var(--am-subtle);}
#apm-prototype-v1 .am-button.am-primary {color:light-dark(#fff,#14223a);background:var(--am-blue);border-color:var(--am-blue);font-weight:600;}
#apm-prototype-v1 .am-button.am-primary:hover {filter:brightness(.96);}
#apm-prototype-v1 .am-button.am-text {border-color:transparent;background:transparent;color:var(--am-blue);padding:6px 0;}
#apm-prototype-v1 .am-button svg {width:14px;height:14px;}
#apm-prototype-v1 .am-statusline {display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap;border:1px solid var(--am-line);background:var(--am-panel);border-radius:8px;padding:10px 13px;margin-bottom:17px;font-size:11px;}
#apm-prototype-v1 .am-statusline .am-statusleft {display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
#apm-prototype-v1 .am-statusline strong {color:var(--am-green);font-weight:600;}
#apm-prototype-v1 .am-statusline.is-error {background:var(--am-redbg);border-color:color-mix(in srgb,var(--am-red) 28%,var(--am-line));}
#apm-prototype-v1 .am-statusline.is-error strong {color:var(--am-red);}
#apm-prototype-v1 .am-statusline.is-warn {background:var(--am-amberbg);border-color:color-mix(in srgb,var(--am-amber) 25%,var(--am-line));}
#apm-prototype-v1 .am-statusline.is-warn strong {color:var(--am-amber);}
#apm-prototype-v1 .am-muted {color:var(--am-muted);}
#apm-prototype-v1 .am-metrics {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px;}
#apm-prototype-v1 .am-metric {text-align:left;border:1px solid var(--am-line);border-radius:10px;padding:13px 14px 12px;background:var(--am-panel);min-width:0;position:relative;}
#apm-prototype-v1 .am-metric:hover {border-color:var(--am-blue);}
#apm-prototype-v1 .am-metric .am-metriclabel {display:flex;align-items:center;justify-content:space-between;gap:4px;color:var(--am-muted);font-size:11px;margin-bottom:10px;}
#apm-prototype-v1 .am-metric .am-metricvalue {display:block;font-size:31px;font-weight:700;line-height:1;letter-spacing:-.045em;font-variant-numeric:tabular-nums;}
#apm-prototype-v1 .am-metric .am-metricvalue.is-word {font-size:23px;}
#apm-prototype-v1 .am-metric .am-metricnote {display:block;font-size:10px;color:var(--am-muted);margin-top:9px;}
#apm-prototype-v1 .am-metric.is-down {box-shadow:inset 0 3px 0 var(--am-red);}
#apm-prototype-v1 .am-metric.is-down .am-metricvalue {color:var(--am-red);}
#apm-prototype-v1 .am-metric.is-new .am-metricvalue {color:var(--am-blue);}
#apm-prototype-v1 .am-metric.is-up .am-metricvalue {color:var(--am-green);}
#apm-prototype-v1 .am-metric.is-unknown .am-metricvalue {color:var(--am-amber);}
#apm-prototype-v1 .am-panel {background:var(--am-panel);border:1px solid var(--am-line);border-radius:10px;min-width:0;overflow:clip;}
#apm-prototype-v1 .am-panelhead {padding:15px 16px 13px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;}
#apm-prototype-v1 .am-panelhead .am-muted {font-size:11px;}
#apm-prototype-v1 .am-badge {display:inline-flex;align-items:center;gap:4px;border-radius:5px;padding:3px 6px;font-size:10px;font-weight:550;white-space:nowrap;background:var(--am-subtle);color:var(--am-muted);}
#apm-prototype-v1 .am-badge.red {color:var(--am-red);background:var(--am-redbg);}
#apm-prototype-v1 .am-badge.blue {color:var(--am-blue);background:var(--am-bluebg);}
#apm-prototype-v1 .am-badge.green {color:var(--am-green);background:var(--am-greenbg);}
#apm-prototype-v1 .am-badge.amber {color:var(--am-amber);background:var(--am-amberbg);}
#apm-prototype-v1 .am-tabs {display:flex;gap:4px;flex-wrap:wrap;padding:0 16px 12px;border-bottom:1px solid var(--am-line);}
#apm-prototype-v1 .am-tab {border:0;background:transparent;color:var(--am-muted);padding:6px 9px;border-radius:6px;font-size:11px;}
#apm-prototype-v1 .am-tab.is-active {background:var(--am-bluebg);color:var(--am-blue);font-weight:650;}
#apm-prototype-v1 .am-tab b {margin-left:4px;font-weight:650;}
#apm-prototype-v1 .am-toolbar {display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px;}
#apm-prototype-v1 .am-searchbox {display:flex;align-items:center;gap:7px;border:1px solid var(--am-line);background:var(--am-subtle);border-radius:6px;padding:7px 9px;max-width:100%;min-width:200px;flex:1;}
#apm-prototype-v1 .am-searchbox svg {width:14px;height:14px;color:var(--am-muted);}
#apm-prototype-v1 .am-searchbox input {width:100%;min-width:0;background:transparent;border:0;color:var(--am-ink);font-size:11px;padding:0;}
#apm-prototype-v1 .am-toolbar select {border:1px solid var(--am-line);border-radius:6px;background:var(--am-panel);color:var(--am-ink);font-size:11px;padding:7px 9px;max-width:100%;}
#apm-prototype-v1 .am-check {display:flex;align-items:center;gap:5px;font-size:11px;color:var(--am-muted);white-space:nowrap;}
#apm-prototype-v1 .am-check input {accent-color:var(--am-blue);margin:0;}
#apm-prototype-v1 .am-tablewrap {overflow-x:auto;}
#apm-prototype-v1 table {width:100%;border-collapse:collapse;text-align:left;font-size:11px;}
#apm-prototype-v1 th {color:var(--am-muted);font-size:10px;font-weight:550;background:var(--am-subtle);padding:9px 10px;white-space:nowrap;}
#apm-prototype-v1 th:first-child,#apm-prototype-v1 td:first-child {padding-left:16px;}
#apm-prototype-v1 th:last-child,#apm-prototype-v1 td:last-child {padding-right:16px;}
#apm-prototype-v1 td {padding:11px 10px;border-top:1px solid var(--am-line);vertical-align:middle;}
#apm-prototype-v1 tbody tr:hover {background:var(--am-subtle);}
#apm-prototype-v1 .am-aplink {display:block;border:0;background:transparent;color:var(--am-blue);padding:0;font-weight:650;font-size:11px;white-space:nowrap;text-align:left;}
#apm-prototype-v1 .am-cellsub {display:block;color:var(--am-muted);font-size:10px;margin-top:3px;white-space:nowrap;}
#apm-prototype-v1 .am-cellmain {font-weight:550;white-space:nowrap;}
#apm-prototype-v1 .am-statuscell {min-width:88px;}
#apm-prototype-v1 .am-statuscell .am-badge {margin-bottom:1px;}
#apm-prototype-v1 .am-pager {display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px;border-top:1px solid var(--am-line);color:var(--am-muted);font-size:10px;flex-wrap:wrap;}
#apm-prototype-v1 .am-pager .am-button {padding:4px 8px;font-size:10px;}
#apm-prototype-v1 .am-empty {padding:35px 20px;text-align:center;}
#apm-prototype-v1 .am-empty strong {display:block;font-size:13px;font-weight:600;margin-bottom:7px;}
#apm-prototype-v1 .am-empty span {color:var(--am-muted);font-size:11px;}
#apm-prototype-v1 .am-footnote {display:flex;gap:12px;flex-wrap:wrap;margin-top:13px;font-size:10px;color:var(--am-muted);}
#apm-prototype-v1 .am-footnote b {font-weight:600;color:var(--am-ink);}
#apm-prototype-v1 .am-footer {display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;border-top:1px solid var(--am-line);padding:10px 22px;color:var(--am-muted);font-size:10px;background:var(--am-panel);}
#apm-prototype-v1 .am-historybanner {display:flex;align-items:center;gap:9px;justify-content:space-between;background:var(--am-bluebg);color:var(--am-blue);padding:9px 12px;border-radius:7px;margin-bottom:14px;font-size:11px;}
#apm-prototype-v1 .am-detailgrid {display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;}
#apm-prototype-v1 .am-detailgrid .am-panel {padding:17px;}
#apm-prototype-v1 .am-detailgrid .am-wide {grid-column:1/-1;}
#apm-prototype-v1 .am-detailheader {display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
#apm-prototype-v1 .am-detailheader h1 {font-size:22px;}
#apm-prototype-v1 .am-detailmeta {display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--am-muted);margin:8px 0 17px;}
#apm-prototype-v1 .am-detailpairs {display:grid;grid-template-columns:minmax(90px,.8fr) minmax(0,1.2fr);gap:9px 12px;margin:13px 0 0;font-size:11px;}
#apm-prototype-v1 .am-detailpairs dt {color:var(--am-muted);}
#apm-prototype-v1 .am-detailpairs dd {margin:0;overflow-wrap:anywhere;font-weight:550;}
#apm-prototype-v1 .am-detailpairs .am-note {font-weight:400;font-size:10px;color:var(--am-muted);display:block;margin-top:2px;}
#apm-prototype-v1 .am-timeline {list-style:none;padding:0 0 0 6px;margin:17px 0 0;}
#apm-prototype-v1 .am-timeline li {position:relative;padding:0 0 17px 20px;border-left:1px solid var(--am-line);}
#apm-prototype-v1 .am-timeline li:last-child {padding-bottom:0;}
#apm-prototype-v1 .am-timeline li:before {content:"";position:absolute;left:-4px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--am-blue);}
#apm-prototype-v1 .am-timeline li.red:before {background:var(--am-red);}
#apm-prototype-v1 .am-timeline li.green:before {background:var(--am-green);}
#apm-prototype-v1 .am-timeline li.amber:before {background:var(--am-amber);}
#apm-prototype-v1 .am-timeline time {font-size:10px;color:var(--am-muted);display:block;}

  function filteredRows(){

  function renderFlow(){
    const steps=[
      ["01 · 최초 실행","연결을 설정합니다","AirWave 주소·조회 계정·수집 간격 확인","설정 화면 보기","settings"],
      ["02 · 자동 수집","다운 목록이 갱신됩니다","이번 Down·신규 Down·복구·미확인 구분","다운 현황 보기","dashboard"],
      ["03 · AP 선택","연결 위치와 이력을 봅니다","스위치·포트·첫 감지·관측 공백 확인","AP 상세 보기","sample-detail"],
      ["04 · 추적과 조치","복구 확인까지 이어갑니다","조치 메모 기록·회차별 현황·복구 이력","수집 기록 보기","runs"]
    ];
    q("#am-stage").innerHTML='<div class="am-heading"><div><h1>사용자에게 보이는 흐름</h1><p class="am-subtitle">첫 설정 이후에는 다운 AP 현황에서 업무를 시작합니다.</p></div>'+button("현황으로 돌아가기","dashboard",true)+'</div>'+
      '<div class="am-flow">'+steps.map(s=>'<section class="am-flowstep"><span class="am-stepnumber">'+s[0]+'</span><h2>'+s[1]+'</h2><p>'+s[2]+'</p>'+button(s[3],s[4],false)+'</section>').join("")+'</div>'+
      '<div class="am-fork"><div><strong>유효한 Up 확인 → 복구 이력</strong>같은 AP의 열린 장애 사건에 복구 확인 시각을 남깁니다.</div><div><strong>조회 실패 → 마지막 목록 유지</strong>현재 미확인을 표시하고 기존 장애를 복구 처리하지 않습니다.</div></div>'+
      '<div class="am-statusline" style="margin-top:15px"><span>실제 제품의 설계</span><strong>화면 닫기와 자동 수집 중지는 별도</strong></div>';
  }
  function render(){
    renderChrome();
    if(state.view==="dashboard")renderDashboard();
    else if(state.view==="detail")renderDetail();
    else if(state.view==="history")renderHistory();
    else if(state.view==="runs")renderRuns();
    else if(state.view==="settings")renderSettings();
    else renderFlow();
    icons();
  }
  function show(view){state.view=view;render();}
  function selectAP(id){state.backView=state.view;state.selected=id;state.view="detail";render();q("#am-back").focus({preventScroll:true});}
  function csv(){
    const r=run(),rows=filteredRows().rows;
    const cell=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
    const header=["데이터구분","수집시각_KST","AP이름","AP_IP","설치위치","SW이름","SW_IP","SW포트","이번상태","마지막확인","첫Down감지","계획작업"];
    const content="\uFEFF"+[header,...rows.map(a=>["가상 모의데이터","2026-11-15 "+r.time,a.name,a.ip,a.place,a.sw,a.swip,a.port,statusFor(a.id),lastSeen(a.id),a.firstAt||"",a.planned?"예":"아니오"])].map(line=>line.map(cell).join(",")).join("\r\n");
    try{
      const url=URL.createObjectURL(new Blob([content],{type:"text/csv;charset=utf-8"}));
      const link=document.createElement("a");link.href=url;link.download="airwave-demo-"+r.time.replace(":","")+"-down.csv";root.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
      toast("현재 필터의 가상 AP "+rows.length+"대가 CSV로 준비되었습니다.");
    }catch(e){toast("이 미리보기에서는 다운로드가 제한될 수 있습니다.");}
  }
  root.addEventListener("click",e=>{
    const b=e.target.closest("button");if(!b||!root.contains(b)||b.disabled)return;
    if(b.dataset.view){stopPlay();show(b.dataset.view);return;}
    if(b.dataset.ap){stopPlay();selectAP(Number(b.dataset.ap));return;}
    if(b.dataset.filter){state.filter=b.dataset.filter;state.page=1;render();return;}
    if(b.dataset.history){state.historyFilter=b.dataset.history;render();return;}
    if(b.dataset.run!==undefined){stopPlay();state.snapshot=Number(b.dataset.run);state.view="dashboard";state.filter="open";state.query="";state.page=1;render();return;}
    const a=b.dataset.action;
    if(a==="play"){play();return;}
    if(a==="dashboard"||a==="settings"||a==="runs"){stopPlay();if(a==="dashboard")state.snapshot=null;show(a);return;}
    if(a==="sample-detail"){stopPlay();state.backView="flow";state.selected=1;state.view="detail";render();return;}
    if(a==="back"){show(state.backView==="detail"?"dashboard":state.backView);return;}
    if(a==="live"){state.snapshot=null;state.page=1;render();return;}
    if(a==="pause"){stopPlay();state.paused=!state.paused;render();toast(state.paused?"모의 수집을 일시정지했습니다. 마지막 관측값을 표시합니다.":"모의 수집을 재개했습니다.");return;}
    if(a==="collect"){stopPlay();setScenario(state.live+1);toast("다음 모의 수집 회차를 표시했습니다.");return;}
    if(a==="filter-confirmed"||a==="filter-new"||a==="filter-unknown"){state.filter=a.replace("filter-","");state.page=1;render();return;}
    if(a==="recovered"){state.historyFilter="recovered";show("history");return;}
    if(a==="prevpage"||a==="nextpage"){state.page+=a==="prevpage"?-1:1;renderRows();return;}
    if(a==="csv"){csv();return;}
    if(a==="test"){
      const address=q("#am-address").value.trim(),user=q("#am-user").value.trim();
      if(!address.startsWith("https://")||!user){toast("모의 주소는 https:// 형식, 조회 계정은 빈 값 없이 입력해 주세요.");return;}
      state.tested=true;renderSettings();icons();toast("모의 연결만 확인했습니다. 실제 AirWave에는 접속하지 않았습니다.");return;
    }
    if(a==="save-settings"){state.view="dashboard";state.filter="open";state.query="";state.page=1;setScenario(0);toast("설정 모의체험 완료 · 가상 다운 현황을 표시합니다.");}
  });
  root.addEventListener("input",e=>{
    if(e.target.id==="am-search"){state.query=e.target.value;state.page=1;renderRows();}
    const setting={"am-address":"address","am-user":"user","am-password":"password"}[e.target.id];
    if(setting){state.settings[setting]=e.target.value;resetSettingsTest();}
  });
  function resetSettingsTest(){
    state.tested=false;
    const result=q("#am-testresult");if(!result)return;
    result.classList.remove("is-pass");result.innerHTML="<strong>연결 확인 전</strong>설정을 바꿨습니다. 모의 연결 확인을 다시 진행하세요.";
    q('[data-action="save-settings"]').disabled=true;
    q('[data-action="test"]').textContent="모의 연결 확인";
  }
  root.addEventListener("change",e=>{
    if(e.target.id==="am-scenario"){stopPlay();setScenario(Number(e.target.value));}
    if(e.target.id==="am-sort"){state.sort=e.target.value;state.page=1;renderRows();}
    if(e.target.id==="am-hideplanned"){state.hidePlanned=e.target.checked;state.page=1;renderRows();}
    if(e.target.id==="am-proxy"){state.settings.proxy=e.target.value;resetSettingsTest();}
  });
  root.addEventListener("submit",e=>{
    if(e.target.id!=="am-noteform")return;e.preventDefault();
    const text=q("#am-note").value.trim();if(!text){toast("조치 내용을 입력해 주세요.");q("#am-note").focus();return;}
    (state.notes[state.selected]||(state.notes[state.selected]=[])).push({text,time:"11/15 "+run().time+" (모의)"});
    renderDetail();icons();toast("조치 메모를 저장했습니다. AP의 상태와 복구 여부는 바뀌지 않았습니다.");
  });
  render();
})();
</script>

</body></html>
